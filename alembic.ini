# alembic.ini
# ────────────
# Alembic configuration. The DATABASE_URL is read from the environment
# (via env.py) so this file is safe to commit to version control.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Logging config — kept minimal; app-level logging is configured in middleware/logging.py
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
